spring:

  datasource:
    url: jdbc:postgresql://${HMS_DB_HOST}:${HMS_DB_PORT:5432}/${HMS_DB_NAME}
    username: ${HMS_DB_USER}
    password: ${HMS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: ${HMS_DB_MAX_POOL_SIZE:20}
      minimum-idle: ${HMS_DB_MIN_IDLE:5}

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

  data:
    redis:
      host: ${HMS_REDIS_HOST}
      port: ${HMS_REDIS_PORT:6379}
      password: ${HMS_REDIS_PASSWORD:}

  rabbitmq:
    host: ${HMS_RABBITMQ_HOST}
    port: ${HMS_RABBITMQ_PORT:5672}
    username: ${HMS_RABBITMQ_USERNAME}
    password: ${HMS_RABBITMQ_PASSWORD}

server:
  forward-headers-strategy: none

hms:
  security:
    api:
      allowed-origins: ${HMS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.hotelmanagement.hms: INFO
