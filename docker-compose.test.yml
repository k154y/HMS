services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hms_test
      POSTGRES_USER: hms_test
      POSTGRES_PASSWORD: hms_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_test -d hms_test"]
      interval: 2s
      retries: 20
  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
