services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hms_test
      POSTGRES_USER: hms_test
      POSTGRES_PASSWORD: hms_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hms_test -d hms_test"]
      interval: 2s
      retries: 20
  test-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  test-rabbitmq:
    image: rabbitmq:4.3.5-alpine
    user: "100:101"
    environment:
      RABBITMQ_DEFAULT_USER: hms_test
      RABBITMQ_DEFAULT_PASS: hms_test_only
    tmpfs:
      - /var/lib/rabbitmq:uid=100,gid=101,mode=0700
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 30s
      retries: 20
      start_period: 15s
