name: HMS Backend CI and Container Image

on:
  push:
    branches:
      - yfeature
      - devs
      - main
    paths:
      - "apps/api/**"
      - "deployment/docker/backend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"
      - "deployment/production/**"
      - "deployment/staging/**"

  pull_request:
    branches:
      - devs
      - main
    paths:
      - "apps/api/**"
      - "deployment/docker/backend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"
      - "deployment/production/**"
      - "deployment/staging/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: k154y/hms-api

concurrency:
  group: hms-backend-${{ github.ref }}
  cancel-in-progress: true


jobs:

  # ========================================================
  # 1. Backend verification
  # ========================================================

  test:
    name: Test backend
    runs-on: ubuntu-latest

    timeout-minutes: 25

    # ======================================================
    # Disposable CI infrastructure
    # ======================================================
    #
    # These services exist only during this GitHub Actions
    # job.
    #
    # They contain NO staging or production data.
    # ======================================================

    services:

      # ----------------------------------------------------
      # PostgreSQL
      # ----------------------------------------------------

      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: hms_test
          POSTGRES_USER: hms_test
          POSTGRES_PASSWORD: hms_test_only

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U hms_test -d hms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10


      # ----------------------------------------------------
      # Redis
      # ----------------------------------------------------

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10


      # ----------------------------------------------------
      # RabbitMQ
      # ----------------------------------------------------

      rabbitmq:
        image: rabbitmq:4.3.5-alpine

        env:
          RABBITMQ_DEFAULT_USER: hms_test
          RABBITMQ_DEFAULT_PASS: hms_test_only

        ports:
          - 5672:5672

        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 15s


    # ======================================================
    # Test environment
    # ======================================================

    env:

      # PostgreSQL
      HMS_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/hms_test
      HMS_TEST_DB_USER: hms_test
      HMS_TEST_DB_PASSWORD: hms_test_only

      # Redis
      HMS_TEST_REDIS_HOST: 127.0.0.1
      HMS_TEST_REDIS_PORT: 6379

      # RabbitMQ
      HMS_RABBITMQ_HOST: 127.0.0.1
      HMS_RABBITMQ_PORT: 5672
      HMS_RABBITMQ_USERNAME: hms_test
      HMS_RABBITMQ_PASSWORD: hms_test_only

      # Disable OTLP publishing during CI.
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "false"


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ----------------------------------------------------
      # Java
      # ----------------------------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml


      # ----------------------------------------------------
      # Tests
      # ----------------------------------------------------

      - name: Run Maven tests
        run: |
          mvn \
            -B \
            -ntp \
            -f apps/api/pom.xml \
            test


      # ----------------------------------------------------
      # Preserve reports even when tests fail
      # ----------------------------------------------------

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: apps/api/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7


  # ========================================================
  # 2. Build and publish backend Docker image
  # ========================================================

  image:
    name: Build backend image
    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - test


    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7


      # ----------------------------------------------------
      # Buildx
      # ----------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # ----------------------------------------------------
      # GHCR authentication
      # ----------------------------------------------------

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ----------------------------------------------------
      # Build / publish immutable image
      # ----------------------------------------------------

      - name: Build and optionally publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/backend.Dockerfile

          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=HMS Backend API

          cache-from: type=gha
          cache-to: type=gha,mode=max