name: HMS Backend CI and Container Image

on:
  push:
    branches:
      - yfeature
      - devs
      - main
    paths:
      - "apps/api/**"
      - "deployment/docker/backend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"

  pull_request:
    branches:
      - devs
      - main
    paths:
      - "apps/api/**"
      - "deployment/docker/backend.Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-image.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: k154y/hms-api

concurrency:
  group: hms-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ========================================================
  # 1. Backend verification
  # ========================================================

  test:
    name: Test backend
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Run Maven tests
        run: |
          mvn \
            -B \
            -ntp \
            -f apps/api/pom.xml \
            test


  # ========================================================
  # 2. Build and publish Docker image
  # ========================================================

  image:
    name: Build backend image
    runs-on: ubuntu-latest

    timeout-minutes: 30

    needs:
      - test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests are validated but must not publish images.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deployment/docker/backend.Dockerfile

          # PR:
          #   build only
          #
          # push/workflow_dispatch:
          #   build + publish
          push: ${{ github.event_name != 'pull_request' }}

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=HMS Backend API

          cache-from: type=gha
          cache-to: type=gha,mode=max