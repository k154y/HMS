services:

  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    container_name: hotel_hms_app

    restart: unless-stopped

    volumes:
      - .:/workspace:cached

    working_dir: /workspace

    command: sleep infinity

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

      rabbitmq:
        condition: service_started


  postgres:
    image: postgres:16-alpine

    container_name: hotel_hms_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_hms
      POSTGRES_USER: hotel_hms_user
      POSTGRES_PASSWORD: hotel_hms_password

    ports:
      - "5432:5432"

    volumes:
      - hotel_hms_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hotel_hms_user -d hotel_hms"
        ]

      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    container_name: hotel_hms_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - hotel_hms_redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]


  rabbitmq:
    image: rabbitmq:3-management-alpine

    container_name: hotel_hms_rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: hotel_hms_user
      RABBITMQ_DEFAULT_PASS: hotel_hms_password

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - hotel_hms_rabbitmq_data:/var/lib/rabbitmq


volumes:

  hotel_hms_postgres_data:

  hotel_hms_redis_data:

  hotel_hms_rabbitmq_data: