services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    container_name: hotel_hms_app

    restart: unless-stopped

    init: true

    working_dir: /workspace

    volumes:
      # Project source code
      - .:/workspace:cached

      # Persistent Maven cache inside Linux/Docker
      - hotel_hms_maven_cache:/home/vscode/.m2

      # Keep frontend node_modules inside Linux/Docker
      - hotel_hms_node_modules:/workspace/apps/web/node_modules

    ports:
      # Next.js frontend
      - "127.0.0.1:3001:3001"

      # Spring Boot backend
      - "127.0.0.1:8081:8081"

    environment:
      # ----------------------------------------------------
      # Java
      # ----------------------------------------------------
      JAVA_HOME: "/usr/lib/jvm/msopenjdk-current"

      # ----------------------------------------------------
      # Spring profile
      # ----------------------------------------------------
      SPRING_PROFILES_ACTIVE: dev

      # ----------------------------------------------------
      # HMS application ports
      # ----------------------------------------------------
      HMS_BACKEND_PORT: "${HMS_BACKEND_PORT:-8081}"
      HMS_FRONTEND_PORT: "${HMS_FRONTEND_PORT:-3001}"

      # ----------------------------------------------------
      # HMS security
      # Values are resolved from the root .env file.
      # ----------------------------------------------------
      HMS_JWT_SECRET: "${HMS_JWT_SECRET}"
      HMS_ALLOWED_ORIGINS: "${HMS_ALLOWED_ORIGINS:-http://localhost:3001}"

      # ----------------------------------------------------
      # PostgreSQL
      # These names match application-dev.yml.
      # ----------------------------------------------------
      HMS_DB_HOST: "${HMS_DB_HOST:-postgres}"
      HMS_DB_PORT: "${HMS_DB_PORT:-5432}"
      HMS_DB_NAME: "${HMS_DB_NAME:-hotel_hms}"
      HMS_DB_USER: "${HMS_DB_USER:-hotel_hms_user}"
      HMS_DB_PASSWORD: "${HMS_DB_PASSWORD:-hotel_hms_password}"

      # ----------------------------------------------------
      # Redis
      # ----------------------------------------------------
      HMS_REDIS_HOST: "${HMS_REDIS_HOST:-redis}"
      HMS_REDIS_PORT: "${HMS_REDIS_PORT:-6379}"

      # ----------------------------------------------------
      # RabbitMQ
      # ----------------------------------------------------
      HMS_RABBITMQ_HOST: "${HMS_RABBITMQ_HOST:-rabbitmq}"
      HMS_RABBITMQ_PORT: "${HMS_RABBITMQ_PORT:-5672}"
      HMS_RABBITMQ_USERNAME: "${HMS_RABBITMQ_USERNAME:-hotel_hms_user}"
      HMS_RABBITMQ_PASSWORD: "${HMS_RABBITMQ_PASSWORD:-hotel_hms_password}"

    # Keep the development container alive.
    # Spring Boot and Next.js will later be started automatically.
    command: sleep infinity

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  postgres:
    image: postgres:16-alpine

    container_name: hotel_hms_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: hotel_hms
      POSTGRES_USER: hotel_hms_user
      POSTGRES_PASSWORD: hotel_hms_password

    ports:
      - "127.0.0.1:15433:5432"

    volumes:
      - hotel_hms_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U hotel_hms_user -d hotel_hms"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  redis:
    image: redis:7-alpine

    container_name: hotel_hms_redis

    restart: unless-stopped

    ports:
      - "127.0.0.1:16379:6379"

    volumes:
      - hotel_hms_redis_data:/data

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  rabbitmq:
    image: rabbitmq:3-management-alpine

    container_name: hotel_hms_rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: hotel_hms_user
      RABBITMQ_DEFAULT_PASS: hotel_hms_password

    ports:
      # RabbitMQ AMQP
      - "127.0.0.1:5672:5672"

      # RabbitMQ Management UI
      - "127.0.0.1:15672:15672"

    volumes:
      - hotel_hms_rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


volumes:
  hotel_hms_postgres_data:

  hotel_hms_redis_data:

  hotel_hms_rabbitmq_data:

  hotel_hms_maven_cache:

  hotel_hms_node_modules: